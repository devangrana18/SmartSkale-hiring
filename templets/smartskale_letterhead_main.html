<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartSkale - Intern Onboarding Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink:       #0f0f0f;
  --ink-mid:   #3a3a3a;
  --ink-light: #6b6b6b;
  --ink-faint: #aaaaaa;
  --rule:      #c8c8c8;
  --rule-lite: #e8e8e8;
  --accent:    #1a1650;
  --accent2:   #534AB7;
  --white:     #ffffff;
  --page-bg:   #d0d0d0;

  /* A4 at 96dpi */
  --page-w: 794px;
  --page-h: 1123px;

  --margin-h: 70px;
}

/* ── RESET ────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ── SCREEN SHELL ─────────────────────────────────── */
body {
  background: var(--page-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 40px 0 60px;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
}

/* ── PAGE / LETTERHEAD ────────────────────────────── */
.page {
  width: var(--page-w);
  min-height: var(--page-h);
  background: var(--white);
  position: relative;
  box-shadow: 0 6px 28px rgba(0,0,0,0.20);
  display: flex;
  flex-direction: column;
}

/* Watermark – centred, faint hexagon mark behind body content */
.watermark {
  position: absolute;
  top: 52%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 380px;
  height: 380px;
  object-fit: contain;
  opacity: 0.035;
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ───────────────────────────────────────── */
.lh-header {
  padding: 34px var(--margin-h) 22px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  z-index: 1;
}
.lh-logo-icon {
  width: 58px;
  height: 58px;
  object-fit: contain;
  flex-shrink: 0;
}
.lh-brand-name {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--accent);
  line-height: 1.1;
}
.lh-brand-tagline {
  margin-top: 3px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--accent2);
}
.lh-rule {
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
}

/* ── CONTENT AREA ─────────────────────────────────── */
.lh-content {
  flex: 1;
  position: relative;
  z-index: 1;
  padding: 56px var(--margin-h);
  min-height: 640px;
}
.lh-content-placeholder {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 15px;
  color: var(--ink-faint);
  text-align: center;
  margin-top: 40px;
}

/* ── FOOTER ───────────────────────────────────────── */
.lh-footer {
  position: relative;
  z-index: 1;
  padding: 18px var(--margin-h) 26px;
  text-align: center;
}
.lh-footer-line {
  font-size: 11px;
  line-height: 1.9;
  color: var(--ink-mid);
  letter-spacing: 0.01em;
}
.lh-footer-line b {
  color: var(--accent);
  font-weight: 700;
}
.lh-footer-sep {
  color: var(--rule);
  margin: 0 8px;
}

/* ── PRINT ────────────────────────────────────────── */
@media print {
  @page { size: A4; margin: 0; }
  body { background: var(--white); padding: 0; }
  .page { box-shadow: none; width: 100%; min-height: 100vh; }

  /* Repeat header/footer on every printed page */
  .lh-header-wrap { position: fixed; top: 0; left: 0; right: 0; background: var(--white); }
  .lh-footer-wrap { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); }
  .lh-content { margin-top: 128px; margin-bottom: 96px; }
}
</style>
